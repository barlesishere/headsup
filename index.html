<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landscape Scrolling Lyrics</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#viewport{height:100dvh;width:100vw;position:relative;overflow:hidden;mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 82%,transparent 100%)}
#lyrics{position:absolute;width:94%;left:3%;top:0;transition:transform .7s cubic-bezier(.22,.8,.2,1)}
.line{height:clamp(76px,29dvh,220px);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 4vw;color:#777;opacity:.52;font-size:clamp(17px,3.1vw,42px);font-weight:450;line-height:1.1;transition:color .6s,opacity .6s,font-size .6s,transform .6s}
.line.active{color:#fff;opacity:1;font-weight:850;font-size:clamp(30px,6.7vw,100px);transform:scale(1.02);letter-spacing:-.025em}
#controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#222d;border:1px solid #555;border-radius:25px;padding:6px 10px;z-index:3}
button{background:#fff;border:0;color:#111;border-radius:18px;padding:7px 12px;font-weight:700}#time{font-size:12px;color:#ccc}#label{position:fixed;top:8px;right:10px;font-size:10px;color:#888;z-index:2}
</style></head><body><div id="label">LANDSCAPE DEMO · SAMPLE LYRICS</div><div id="viewport"><div id="lyrics"></div></div><div id="controls"><button id="play">Play demo</button><button id="restart">Restart</button><span id="time">0:00</span></div><script>
const cues=[{t:0,text:"The lights begin to glow"},{t:4,text:"A quiet street below"},{t:8,text:"We follow where the evening goes"},{t:13,text:"And let the moments flow"},{t:18,text:"The city starts to shine"},{t:23,text:"One heartbeat at a time"},{t:28,text:"We watch the distant stars align"},{t:33,text:"And leave the day behind"},{t:38,text:"Tomorrow waits beyond the blue"},{t:43,text:"A brand new sky, a different view"}];
const lyrics=document.getElementById('lyrics'),viewport=document.getElementById('viewport');lyrics.innerHTML=cues.map(x=>'<div class="line">'+x.text+'</div>').join('');const lines=[...document.querySelectorAll('.line')];
let elapsed=0,playing=false,last=0,idx=-1;
function render(){let i=0;for(let j=0;j<cues.length;j++)if(elapsed>=cues[j].t)i=j;if(i!==idx){idx=i;lines.forEach((el,j)=>el.classList.toggle('active',j===i))}
const line=lines[i];lyrics.style.transform=`translateY(${viewport.clientHeight/2-(line.offsetTop+line.offsetHeight/2)}px)`;document.getElementById('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')}
function frame(now){if(playing){elapsed+=(now-last)/1000;if(elapsed>=48){elapsed=48;playing=false;document.getElementById('play').textContent='Play demo'}render()}last=now;requestAnimationFrame(frame)}
document.getElementById('play').onclick=()=>{if(elapsed>=48)elapsed=0;playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play demo';render()};
document.getElementById('restart').onclick=()=>{elapsed=0;render()};addEventListener('resize',render);render();requestAnimationFrame(frame);
</script></body></html>
